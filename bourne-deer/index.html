<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bourne deer hunting – 500 ft dwelling circles</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; }
  #panel { position: absolute; top: 10px; left: 10px; background: #fffe; padding: 8px 12px;
    font: 13px/1.4 -apple-system, "Segoe UI", sans-serif; border-radius: 6px; max-width: 260px; }
  #panel label { display: block; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>Bourne, MA – Deer Zone 12</b><br>
  Red outline: edge of the area within 500 ft of a dwelling. Outside the outlines (unshaded) is farther than 500 ft from any dwelling.
  <label>Fill opacity <input id="op" type="range" min="0" max="1" step="0.05" value="0"></label>
  <small>Dwellings = buildings on residential parcels (MassGIS). Not legal advice – check regulations, land ownership and permission.</small>
</div>
<script>
const map = new maplibregl.Map({
  container: "map",
  center: [-70.58, 41.7], zoom: 10,
  style: { version: 8,
    sources: { sat: { type: "raster", tileSize: 256, maxzoom: 19,
      tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
      attribution: "Esri World Imagery; MassGIS; MassWildlife" } },
    layers: [{ id: "sat", type: "raster", source: "sat" }] }
});
map.addControl(new maplibregl.NavigationControl());
map.on("load", () => {
  map.addSource("circles", { type: "geojson", data: "bourne_dwelling_zone_500ft.geojson" });
  map.addSource("zone", { type: "geojson", data: "wmz12.geojson" });
  map.addLayer({ id: "zone", type: "line", source: "zone", paint: { "line-color": "#ffd400", "line-width": 2 } });
  map.addLayer({ id: "circles", type: "fill", source: "circles",
    paint: { "fill-color": "#e02020", "fill-opacity": 0 } });
  map.addLayer({ id: "circles-outline", type: "line", source: "circles",
    paint: { "line-color": "#ff2a2a", "line-width": 1.8 } });
  document.getElementById("op").oninput = e => map.setPaintProperty("circles", "fill-opacity", +e.target.value);
});
</script>
</body>
</html>
